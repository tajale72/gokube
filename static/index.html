<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Gokube Weather API</title>

  <link rel="stylesheet" href="/index.css" />
</head>

<body>
  <main class="page">
    <section class="weather-panel">
      <div class="header">
        <p class="eyebrow">Gokube Weather API</p>
        <h1>Local Weather Forecast</h1>
        <p class="subtitle">
          Enter latitude and longitude to fetch the latest forecast.
        </p>
      </div>

      <div class="form-card">
        <div class="field">
          <label for="lat">Latitude</label>
          <input
            type="text"
            id="lat"
            placeholder="32.7767"
            value="32.7767"
          />
        </div>

        <div class="field">
          <label for="long">Longitude</label>
          <input
            type="text"
            id="long"
            placeholder="-96.7970"
            value="-96.7970"
          />
        </div>

        <button type="button" onclick="loadWeatherForecast()">
          Get Weather
        </button>
      </div>

      <div class="weather-card">
        <div class="weather-item">
          <span class="label">Forecast</span>
          <strong id="shortForecast">--</strong>
        </div>

        <div class="weather-item">
          <span class="label">Temperature</span>
          <strong id="temperature">--</strong>
        </div>

        <div class="weather-item">
          <span class="label">Condition</span>
          <strong id="characterization">--</strong>
        </div>
      </div>
    </section>
  </main>

  <script src="/index.js"></script>
</body>
</html>
