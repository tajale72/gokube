# Default values for gokube
# This is a YAML-formatted file.

global:
  namespace: gokube
  imageRegistry: "" # Artifactory registry URL (e.g., your-artifactory.com/docker)
  imagePullSecrets: [] # List of image pull secrets for Artifactory

# CCDA-API Service Configuration
api:
  enabled: true
  name: ccda-api
  image:
    repository: ccda-api # Image name in Artifactory
    tag: "latest"
    pullPolicy: Always
  replicaCount: 2
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  env:
    ADDR: "0.0.0.0"
    PORT: "8080"
    APP_ENV: "production"
    SERVICE_NAME: "ccda-api"
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 1000
    capabilities:
      drop:
        - ALL

# Vue UI Application Configuration
ui:
  enabled: true
  name: vue-ui
  image:
    repository: vue-ui # Image name in Artifactory
    tag: "latest"
    pullPolicy: Always
  replicaCount: 2
  service:
    type: ClusterIP
    port: 80
    targetPort: 80
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  securityContext:
    allowPrivilegeEscalation: false
    runAsNonRoot: true
    runAsUser: 101
    capabilities:
      drop:
        - ALL

# Ingress Configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
  hosts:
    - host: gokube.local
      paths:
        - path: /
          pathType: Prefix
          service: vue-ui
        - path: /api
          pathType: Prefix
          service: ccda-api
    - host: localhost
      paths:
        - path: /
          pathType: Prefix
          service: vue-ui
        - path: /api
          pathType: Prefix
          service: ccda-api
  tls: []

# ConfigMap Configuration
configMap:
  enabled: true
  data:
    ADDR: "0.0.0.0"
    PORT: "8080"
    APP_ENV: "production"
    SERVICE_NAME: "ccda-api"

