{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.ui.name }}
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "gokube.ui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "gokube.ui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gokube.ui.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Values.ui.name }}
        image: {{ include "gokube.ui.image" . }}
        imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.ui.service.targetPort }}
          protocol: TCP
        resources:
          {{- toYaml .Values.ui.resources | nindent 10 }}
        {{- if .Values.ui.securityContext }}
        securityContext:
          {{- toYaml .Values.ui.securityContext | nindent 10 }}
        {{- end }}
{{- end }}

