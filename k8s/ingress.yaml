apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gokube
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: gokube.local  # Replace with your actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gokube
            port:
              number: 80 