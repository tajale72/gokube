apiVersion: apps/v1
kind: Deployment
metadata:
  name: gokube 
  labels:
    app: gokube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gokube
  template:
    metadata:
      labels:
        app: gokube
    spec:
      containers:
      - name: gokube
        image: gokube:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10 